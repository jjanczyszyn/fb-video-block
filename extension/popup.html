<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #101418;
        color: #e7edf3;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tagline {
        font-size: 12px;
        opacity: 0.65;
        margin-bottom: 14px;
      }
      label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid #232c36;
        cursor: pointer;
      }
      input[type="checkbox"] {
        margin-top: 2px;
        accent-color: #1877f2;
      }
      .name {
        font-size: 13px;
        font-weight: 600;
      }
      .desc {
        font-size: 11.5px;
        opacity: 0.65;
        margin-top: 2px;
      }
      .section {
        border-top: 1px solid #232c36;
        padding-top: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        padding: 6px 8px;
        border-radius: 6px;
        border: 0;
        background: #1877f2;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #232c36;
        color: #e7edf3;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 56px;
        margin-top: 8px;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #232c36;
        background: #0b0e11;
        color: #e7edf3;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        resize: vertical;
      }
      .warn {
        font-size: 11.5px;
        color: #f5b041;
        margin-top: 6px;
      }
      .note {
        font-size: 11px;
        opacity: 0.5;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <h1>⏸️ FB Video Block</h1>
    <div class="tagline">Facebook, minus the video quicksand.</div>

    <label>
      <input type="checkbox" id="hideVideos" />
      <span>
        <span class="name">Hide videos completely</span>
        <span class="desc" style="display: block"
          >Feed videos are collapsed into a small note before you see
          them.</span
        >
      </span>
    </label>

    <label>
      <input type="checkbox" id="blockAutoplay" />
      <span>
        <span class="name">Block autoplay</span>
        <span class="desc" style="display: block"
          >Any visible video stays paused until you deliberately click
          it.</span
        >
      </span>
    </label>

    <label>
      <input type="checkbox" id="blockPages" />
      <span>
        <span class="name">Block Reels &amp; Watch pages</span>
        <span class="desc" style="display: block"
          >Shows a "take me back" screen. No exceptions.</span
        >
      </span>
    </label>

    <label>
      <input type="checkbox" id="allowFriends" />
      <span>
        <span class="name">Show videos from friends</span>
        <span class="desc" style="display: block"
          >Friends' posts, Stories and Reels stay visible, and their Reels open
          when you click them.</span
        >
      </span>
    </label>

    <label>
      <input type="checkbox" id="friendsOnly" />
      <span>
        <span class="name">Friends-only feed</span>
        <span class="desc" style="display: block"
          >Completely hides every post in your News Feed that isn't from a
          friend: pages, groups, suggestions and ads.</span
        >
      </span>
    </label>

    <div class="section">
      <span class="name">Your friends</span>
      <span class="desc" style="display: block" id="friendCount"
        >No friends synced yet.</span
      >
      <div class="warn" id="friendWarn" hidden>
        The friend options switch on once your friends are synced. Until then
        your feed is unchanged.
      </div>
      <div class="row">
        <button id="syncFriends">Sync from Facebook</button>
        <button id="clearFriends" class="secondary">Clear</button>
      </div>
      <textarea
        id="extraFriends"
        placeholder="Add friends by hand: one name or profile link per line"
      ></textarea>
    </div>

    <div class="note">
      Changes apply to open Facebook tabs right away. Marketplace is never
      affected.
    </div>
    <script src="lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
