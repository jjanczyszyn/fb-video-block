<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fake home feed (friends)</title>
  </head>
  <body>
    <!-- Mirrors the real 2026 markup: posts tag the author with
         data-ad-rendering-role="profile_name"; the Stories tray and Reels
         shelf label each card with its author. -->
    <div role="main">
      <div>
        <div data-virtualized="false" id="unit-stories">
          <div role="region" aria-label="Stories">
            <div role="grid" aria-label="stories tray">
              <div role="row">
                <div role="gridcell" id="card-create">
                  <a aria-label="Create story" href="/stories/create/">+</a>
                </div>
                <div role="gridcell" id="card-friend-story">
                  <a aria-label="Jane Doe's story" href="/stories/5001/abc/?source=story_tray">
                    <div aria-label="Video player" style="width: 100px; height: 160px"></div>
                  </a>
                </div>
                <div role="gridcell" id="card-stranger-story">
                  <a aria-label="BBC Science Focus Magazine, view story" href="/stories/5002/def/">
                    <div aria-label="Video player" style="width: 100px; height: 160px"></div>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div data-virtualized="false" id="unit-friend-video">
          <div data-ad-rendering-role="profile_name">
            <h4><a href="/jane.doe?__cft__[0]=x"><b><span>Jane Doe</span></b></a></h4>
          </div>
          <a id="friend-reel-link" href="/reel/42/?s=ifu">my reel</a>
          <div aria-label="Video player" style="width: 200px; height: 100px"></div>
        </div>
      </div>
      <div>
        <div data-virtualized="false" id="unit-stranger-video">
          <div data-ad-rendering-role="profile_name">
            <h4><a href="/zendatecom?__cft__[0]=x"><b><span>ZenDate</span></b></a></h4>
          </div>
          <a id="stranger-reel-link" href="/reel/99/">their reel</a>
        </div>
      </div>
      <div>
        <div data-virtualized="false" id="unit-friend-text">
          <div data-ad-rendering-role="profile_name">
            <h4><a href="/profile.php?id=777"><span>John Smith</span></a></h4>
          </div>
          <p>Friend text post.</p>
        </div>
      </div>
      <div>
        <div data-virtualized="false" id="unit-stranger-text">
          <div data-ad-rendering-role="profile_name">
            <h4><a href="/oh.my.drama"><span>Oh My Drama</span></a></h4>
          </div>
          <p>Page text post.</p>
        </div>
      </div>
      <div>
        <div data-virtualized="false" id="unit-marketplace">
          <h3>Marketplace</h3>
          <a href="/marketplace/item/123/">Bike, $50</a>
        </div>
      </div>
      <div>
        <div data-virtualized="true" id="unit-spacer"></div>
      </div>
    </div>
    <!-- Right rail: a pending friend request (real 2026 markup, trimmed). -->
    <div role="complementary" id="right_rail_container">
      <h3>Friend requests</h3>
      <div id="request">
        <a href="/friends/requests/?profile_id=31337" aria-label="Req Person"></a>
        <a href="/friends/requests/?profile_id=31337"><span>Req Person</span></a>
        <a aria-label="Profile picture of Pal, who is a mutual friend" href="/pal.one"></a>
        <span>3 mutual friends</span>
        <div aria-label="Confirm" role="button" id="confirm-request">Confirm</div>
        <div aria-label="Delete" role="button">Delete</div>
      </div>
    </div>

    <!-- Facebook embeds recent notifications as JSON in the page. -->
    <script type="application/json" data-sjs>
      {"require":[["ScheduledServerJS","handle",null,[{"__bbox":{"result":{"data":{"viewer":{"notifications_page":{"edges":[
        {"node":{"notif":{"body":{"ranges":[{"entity":{"__typename":"User","id":"424242","url":"https://www.facebook.com/newbie.person"},"offset":0,"length":13}],"text":"Newbie Person accepted your friend request."}}}},
        {"node":{"notif":{"body":{"ranges":[{"entity":{"__typename":"User","id":"31337","url":"https://www.facebook.com/req.person"},"offset":0,"length":10}],"text":"Req Person sent you a friend request."}}}}
      ]}}}}}}]]]}
    </script>
  </body>
</html>
