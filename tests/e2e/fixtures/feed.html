<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fake feed</title>
    <style>
      video {
        width: 480px;
        height: 270px;
        background: #000;
        display: block;
        margin: 40px auto;
      }
    </style>
  </head>
  <body>
    <h1>Feed fixture</h1>
    <video id="vid" autoplay muted playsinline></video>
    <script>
      // Simulate Facebook: feed the video a live canvas stream and
      // aggressively retry play(), like FB's player does.
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = 270;
      const ctx = canvas.getContext("2d");
      let hue = 0;
      setInterval(() => {
        ctx.fillStyle = `hsl(${(hue += 7) % 360}, 70%, 50%)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, 100);

      const video = document.getElementById("vid");
      video.srcObject = canvas.captureStream(10);

      window.__playAttempts = 0;
      window.__playRejections = 0;
      setInterval(() => {
        window.__playAttempts++;
        const p = video.play();
        if (p && p.catch) p.catch(() => window.__playRejections++);
      }, 200);
    </script>
  </body>
</html>
